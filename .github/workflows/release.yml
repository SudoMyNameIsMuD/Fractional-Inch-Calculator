name: Build release binaries

# Tag push (v*) builds binaries on all platforms and publishes a GitHub Release.
# Manual runs (workflow_dispatch) only build and upload artifacts; nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: FractionalInchCalculator-linux
          - os: windows-latest
            asset: FractionalInchCalculator-windows.exe
          - os: macos-latest
            asset: FractionalInchCalculator-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name FractionalInchCalculator calculator.py
      - name: Rename artifact
        shell: bash
        run: |
          if [ -f dist/FractionalInchCalculator.exe ]; then mv dist/FractionalInchCalculator.exe "dist/${{ matrix.asset }}";
          else mv dist/FractionalInchCalculator "dist/${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
